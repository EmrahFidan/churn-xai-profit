random_seed: 42
# Adim 7 — saglamlik icin tekrarli kosu tohumlari (ort ± std + %95 CI)
seeds: [42, 7, 123, 2024, 99]

# Each dataset is processed independently in its own lane.
# Datasets are NEVER merged; outputs are kept separate per dataset.
datasets:
  telco:
    name: Telco Customer Churn
    file: telco.csv
    sector: telecom
    target: Churn
  cell2cell:
    name: Cell2Cell
    file: cell2cell.csv
    sector: telecom
    target: Churn
  ecommerce:
    name: E-commerce Churn
    file: ecommerce.csv
    sector: ecommerce
    target: Churn
  iranian:
    name: Iranian Churn
    file: iranian.csv
    sector: telecom
    target: Churn
  bank:
    name: Bank Customer Churn
    file: bank.csv
    sector: banking
    target: Exited

# Adim 5 — maliyete duyarli esik / kar / ROI / EMP parametreleri (sihirli sayi yok;
# tum sonuclar parametre araligi uzerinden raporlanir).
profit:
  ufuk_ay: 24                 # CLV ufku (ay)
  banka_marj_yillik: 0.02     # bank: Balance uzerinden yillik marj proxy
  c_oranlari: [0.01, 0.02, 0.05, 0.10, 0.20]   # mudahale maliyeti = ortalama_CLV * oran
  gamma_listesi: [0.2, 0.3, 0.4, 0.5]          # elde-tutma basari olasiligi
  emp_c_oran: 0.05            # EMP icin referans maliyet orani (ort_CLV'nin yuzdesi)
  emp_beta: [6, 14]           # EMP: gamma ~ Beta(alpha, beta) (Verbraken varsayilani, E=0.3)
